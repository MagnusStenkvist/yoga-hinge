<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.yogahinge"/>
  </policy>
  <!-- Any local user may read the angle and change the thresholds.
       This is a single-user laptop; tighten with polkit if that matters. -->
  <policy context="default">
    <allow send_destination="org.yogahinge"/>
  </policy>
</busconfig>
